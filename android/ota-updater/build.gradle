plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def configuredReleaseSigningKeys = releaseSigningKeys.findAll {
    keystoreProperties.getProperty(it)
}
if (!configuredReleaseSigningKeys.isEmpty()
        && configuredReleaseSigningKeys.size() != releaseSigningKeys.size()) {
    throw new GradleException(
            "keystore.properties must define ${releaseSigningKeys.join(', ')}")
}
def hasReleaseSigning = configuredReleaseSigningKeys.size() == releaseSigningKeys.size()
def bootstrapTokenSha256 = providers
        .gradleProperty("mirrorOtaBootstrapTokenSha256")
        .orElse("")
        .get()

android {
    namespace "dev.mirror.repurpose.updater"
    compileSdk 35

    defaultConfig {
        applicationId "dev.mirror.repurpose.updater"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.2.0"
        buildConfigField(
                "String",
                "SUPPORTED_FINGERPRINT",
                "\"mirror/mirror/msm8916_64:6.0.1/IFC-6309-2.0-MIR/329:user/release-keys\"")
        buildConfigField(
                "String",
                "BOOTSTRAP_TOKEN_SHA256",
                "\"${bootstrapTokenSha256.toLowerCase()}\"")
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.java.srcDirs += "../common/src/main/java"
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd:2.3.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
