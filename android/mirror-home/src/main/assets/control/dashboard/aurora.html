<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dashboard/aurora.css">
  <title>Mirror</title>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="curtain c1"></div>
    <div class="curtain c2"></div>
    <div class="curtain c3"></div>
    <div class="curtain c4"></div>
    <div class="horizon"></div>
  </div>
  <main class="fade">
    <div class="clock"><span id="time" class="digits">--:--</span><span id="meridiem" class="meridiem"></span></div>
    <div id="date" class="date">&nbsp;</div>
  </main>
  <footer class="fade">
    <span id="name" class="name">Mirror</span>
    <span id="status" class="status"></span>
  </footer>
  <script src="/dashboard/aurora.js"></script>
</body>
</html>
