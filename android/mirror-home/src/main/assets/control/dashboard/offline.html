<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dashboard/offline.css">
  <title>Mirror</title>
</head>
<body>
  <main>
    <div class="clock"><span id="time" class="digits">--:--</span><span id="meridiem" class="meridiem"></span></div>
    <div id="date" class="date">&nbsp;</div>
  </main>
  <footer>
    <span class="dot" aria-hidden="true"></span>
    <span id="status">Dashboard unavailable &middot; retrying</span>
  </footer>
  <script src="/dashboard/offline.js"></script>
</body>
</html>
