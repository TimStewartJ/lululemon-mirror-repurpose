<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dashboard/gallery.css">
  <title>Mirror Gallery</title>
</head>
<body>
  <main id="stage">
    <div id="empty" class="empty">
      <p class="empty-title">No photos yet</p>
      <p class="empty-hint">Add photos from the Mirror controls on your phone. They stay on this Mirror.</p>
    </div>
  </main>
  <div class="scrim" aria-hidden="true"></div>
  <aside class="caption fade">
    <div class="clock"><span id="clock" class="digits">--:--</span><span id="meridiem" class="meridiem"></span></div>
    <div id="date" class="date">&nbsp;</div>
  </aside>
  <script src="/dashboard/gallery.js"></script>
</body>
</html>
