plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def configuredReleaseSigningKeys = releaseSigningKeys.findAll {
    keystoreProperties.getProperty(it)
}
if (!configuredReleaseSigningKeys.isEmpty()
        && configuredReleaseSigningKeys.size() != releaseSigningKeys.size()) {
    throw new GradleException(
            "keystore.properties must define ${releaseSigningKeys.join(', ')}")
}
def hasReleaseSigning = configuredReleaseSigningKeys.size() == releaseSigningKeys.size()
def configuredVersionCode = providers.gradleProperty("mirrorHomeVersionCode")
def configuredVersionName = providers.gradleProperty("mirrorHomeVersionName")
def otaHealthFailureTest = providers
        .gradleProperty("mirrorOtaHealthFailureTest")
        .orElse("false")
        .get()
def backgroundVideoBootstrapHash = providers
        .gradleProperty("mirrorBackgroundVideoBootstrapTokenSha256")
        .orElse("")
        .get()
if (!backgroundVideoBootstrapHash.isEmpty()
        && !backgroundVideoBootstrapHash.matches("[0-9a-f]{64}")) {
    throw new GradleException(
            "mirrorBackgroundVideoBootstrapTokenSha256 must be empty or 64 lowercase hex characters")
}

android {
    namespace "dev.mirror.repurpose"
    compileSdk 35

    defaultConfig {
        applicationId "dev.mirror.repurpose"
        minSdk 23
        targetSdk 35
        versionCode configuredVersionCode.isPresent()
                ? configuredVersionCode.get().toInteger()
                : 76
        versionName configuredVersionName.isPresent()
                ? configuredVersionName.get()
                : "2.2.0"
        buildConfigField(
                "boolean",
                "OTA_HEALTH_FAILURE_TEST",
                otaHealthFailureTest.equalsIgnoreCase("true") ? "true" : "false")
        buildConfigField(
                "String",
                "BACKGROUND_VIDEO_BOOTSTRAP_TOKEN_SHA256",
                "\"${backgroundVideoBootstrapHash}\"")
        ndk {
            // The speech recogniser is native code. Mirrors are ARM devices. The
            // Android 6 emulator that every build is validated on is x86_64, and
            // Android installs no app that lacks a library for its processor.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        // Both builds leave out the code that nothing uses (proguard-rules.pro).
        // The emulator suite runs a debug build, and it should meet the same
        // missing code as a Mirror does.
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            // JNA opens the recogniser's library by its file name, so it must be a file.
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.java.srcDirs += "../common/src/main/java"
        test.java.srcDirs += "../common/src/test/java"
    }
}

dependencies {
    def media3Version = "1.9.0"

    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    compileOnly "androidx.annotation:annotation:1.6.0"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "com.google.zxing:core:3.5.3"
    // The newest on-device speech recogniser that still supports Android 6.
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    // Vosk asks for JNA 5.18.1, which Android 6 cannot load: from 5.16.0 its
    // Structure class needs java.util.function, new in Android 7. 5.15.0 is
    // the last release without it.
    //noinspection GradleDependency
    implementation "net.java.dev.jna:jna:5.15.0@aar"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
