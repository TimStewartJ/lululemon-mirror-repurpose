plugins {
    id "com.android.application"
}

android {
    namespace "dev.mirror.repurpose"
    compileSdk 34

    defaultConfig {
        applicationId "dev.mirror.repurpose"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
